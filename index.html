<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">


  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Parkinsans:wght@300..800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="assets/style.css">
  <title>BMI calculator</title>
</head>

<body>
  <div class="info_container">
   <ul>
    <li>Healthy BMI range: 18.5 kg/m2 - 25 kg/m2
    </li>
    <li>Healthy weight for the height: 50.4 kg - 68.1 kg
    </li>
    <li>Lose 11.9 kg to reach a BMI of 25 kg/m2.
    </li>
    <li>BMI Prime: 1.18
    </li>
    <li>Ponderal Index: 17.8 kg/m3
    </li>
   </ul>
  </div>
  <div class="main_container">
    <div class="bmi">
      <div class="card " style="width: 25rem;">
        <div class="card-body">
          <i class="fa-solid fa-weight-scale"></i>
          <h5 class="card-title">BMI CALCULATOR</h5>
          
          <label for="">Height(in cm)</label>
          <input type="number" class="form-control height">
          <label for="">Weight(in KG)</label>
          <input type="number" class="form-control weight">
          <button class="btn btn-success mt-2">Calculate</button>
          
          <p class="result">
         
          </p>

        </div>
      </div>

    </div>
  </div>

  <script>
    let var_weight=document.querySelector('.weight');
    let var_height=document.querySelector('.height');

    let btn_class=document.querySelector('.btn');
    let result_data=document.querySelector('.result');



  

    btn_class.addEventListener('click', function(){
      let weight_cal=Number(var_weight.value);

      let height_cal=Number(var_height.value);
      let final_height=(height_cal/100);
      
       calculate=((weight_cal)/(final_height*final_height));
       
       result_data.innerText=`your bmi is${calculate}`;

     if(calculate<18.5){
      result_data.innerText=`you are underweight eat properly || your bmi is ${calculate}`;
     } else if(calculate>=18.5 && calculate<=24.9){
      result_data.innerText=`you have normal weight ||your bmi is ${calculate}`;

     }else if(calculate>=25 && calculate<=29.9){
      result_data.innerText=`you are overweight maintain your health properly || your bmi is ${calculate}`;
     }else if(calculate>=30){
      result_data.innerText=`you are obesity maintain your health properly || your bmi is ${calculate}`;
     } 
    })


  

  </script>
</body>

</html>
